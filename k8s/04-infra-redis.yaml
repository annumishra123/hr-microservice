# NOTE: Production/3-lakh-user scale ke liye single Redis pod bottleneck +
# single-point-of-failure ban sakta hai. Redis Cluster ya managed (ElastiCache/
# Memorystore/Upstash) use karo waha jaake. Yahan structural reference hai.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: hrms
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: hrms
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
