# Non-secret config — sabhi services yahan se env vars uthate hain.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hrms-config
  namespace: hrms
data:
  AUTH_SERVICE_URL: "http://auth-service:5001"
  EMPLOYEE_SERVICE_URL: "http://employee-service:5002"
  ATTENDANCE_SERVICE_URL: "http://attendance-service:5003"
  NOTIFICATION_SERVICE_URL: "http://notification-service:5004"
  REDIS_URL: "redis://redis:6379"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
  MONGO_URI_AUTH: "mongodb://mongo:27017/hrms_auth"
  MONGO_URI_EMPLOYEE: "mongodb://mongo:27017/hrms_employee"
  MONGO_URI_ATTENDANCE: "mongodb://mongo:27017/hrms_attendance"
  MONGO_URI_NOTIFICATION: "mongodb://mongo:27017/hrms_notification"
  JWT_EXPIRES_IN: "8h"
  JWT_REFRESH_EXPIRES_IN: "7d"
