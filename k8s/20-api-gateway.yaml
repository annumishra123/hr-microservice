apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: hrms
spec:
  replicas: 3   # gateway sabse zyada traffic leta hai (single entry point), isliye baseline zyada
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: api-gateway
          image: your-registry/api-gateway:latest
          ports: [{ containerPort: 4000 }]
          envFrom:
            - configMapRef: { name: hrms-config }
          env:
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: hrms-secrets, key: JWT_SECRET } }
          resources:
            requests: { cpu: "200m", memory: "150Mi" }
            limits: { cpu: "750m", memory: "400Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: hrms
spec:
  selector: { app: api-gateway }
  ports: [{ port: 80, targetPort: 4000 }]
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: hrms
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 3
  maxReplicas: 25   # 3 lakh users -> peak concurrent traffic ke liye headroom
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
