apiVersion: apps/v1
kind: Deployment
metadata:
  name: attendance-service
  namespace: hrms
spec:
  replicas: 2   # baseline replicas — HPA isko traffic ke hisaab se badhayega
  selector: { matchLabels: { app: attendance-service } }
  template:
    metadata: { labels: { app: attendance-service } }
    spec:
      containers:
        - name: attendance-service
          image: your-registry/attendance-service:latest   # docker build+push karke yahan apna image daalo
          ports: [{ containerPort: 5003 }]
          envFrom:
            - configMapRef: { name: hrms-config }
          env:
            - name: PORT
              value: "5003"
            - name: MONGO_URI
              valueFrom: { configMapKeyRef: { name: hrms-config, key: MONGO_URI_ATTENDANCE } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: hrms-secrets, key: JWT_SECRET } }
            - name: JWT_REFRESH_SECRET
              valueFrom: { secretKeyRef: { name: hrms-secrets, key: JWT_REFRESH_SECRET } }

          resources:
            requests: { cpu: "150m", memory: "150Mi" }
            limits: { cpu: "500m", memory: "400Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 5003 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 5003 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: attendance-service
  namespace: hrms
spec:
  selector: { app: attendance-service }
  ports: [{ port: 5003, targetPort: 5003 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: attendance-service-hpa
  namespace: hrms
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: attendance-service
  minReplicas: 2
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 75 }
