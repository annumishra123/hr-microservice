# NOTE: Production me RabbitMQ ko bhi cluster mode (3 nodes, quorum queues)
# me chalao high-availability ke liye. Yahan single-node reference hai.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: hrms
spec:
  replicas: 1
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq } }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - { containerPort: 5672 }
            - { containerPort: 15672 }
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: hrms
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: 5672 }
    - { name: mgmt, port: 15672, targetPort: 15672 }
